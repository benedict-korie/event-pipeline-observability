name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        run: go test ./... -race -v

  validate-provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dashboard JSON
        run: |
          for f in grafana/dashboards/*.json; do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Validate provisioning YAML
        run: |
          pip install pyyaml --break-system-packages -q
          for f in $(find grafana/provisioning -name '*.yml'); do
            echo "Checking $f"
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
